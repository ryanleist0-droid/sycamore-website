# sycamore-website — Fountain → careers jobs sync, GitHub-hosted (RULED 2026-10-19, vault
# decisions/2026-10-19-websites-off-terminator67-github-hosted-automation). Replaces sycamore-jobs-sync.timer on
# terminator67 (08:30 America/New_York; python3 scripts/sync_fountain_jobs.py --push). The script commits to main;
# Vercel's GitHub integration deploys the push as before. Repository secrets (Settings → Secrets and variables → Actions):
#   FOUNTAIN_CLIENT_ID · FOUNTAIN_CLIENT_SECRET      (the two keys of /etc/sycamore/secrets-fountain-sync.env)
# They reach the script as environment variables AND as that same file (created on the runner, root-owned, 0640 — the
# shape the systemd unit gave it), so whichever the script reads, it finds them. Nothing prints them.
name: jobs-sync
on:
  schedule:
    - cron: "30 12 * * *"     # 08:30 America/New_York while on EDT (13:30 UTC in winter would be 09:30 ET: acceptable drift)
  workflow_dispatch:
concurrency: { group: jobs-sync, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: python deps (the script imports yaml; terminator67 had the system PyYAML)
        run: python3 -m pip install --quiet pyyaml
      - name: credentials (env + the unit's EnvironmentFile shape; values never echoed)
        env:
          FOUNTAIN_CLIENT_ID: ${{ secrets.FOUNTAIN_CLIENT_ID }}
          FOUNTAIN_CLIENT_SECRET: ${{ secrets.FOUNTAIN_CLIENT_SECRET }}
        run: |
          test -n "$FOUNTAIN_CLIENT_ID" && test -n "$FOUNTAIN_CLIENT_SECRET" || { echo "::error::FOUNTAIN_CLIENT_ID / FOUNTAIN_CLIENT_SECRET repository secrets are not set"; exit 1; }
          sudo install -d -m 755 /etc/sycamore
          umask 077; printf 'FOUNTAIN_CLIENT_ID=%s\nFOUNTAIN_CLIENT_SECRET=%s\n' "$FOUNTAIN_CLIENT_ID" "$FOUNTAIN_CLIENT_SECRET" > "$RUNNER_TEMP/fs.env"
          sudo install -m 640 -o root -g "$(id -gn)" "$RUNNER_TEMP/fs.env" /etc/sycamore/secrets-fountain-sync.env && rm -f "$RUNNER_TEMP/fs.env"
      - name: git identity for the sync commit
        run: |
          git config user.name "sycamore-jobs-sync (GitHub Actions)"
          git config user.email "jobs-sync@users.noreply.github.com"
      - name: sync + commit + push
        env:
          FOUNTAIN_CLIENT_ID: ${{ secrets.FOUNTAIN_CLIENT_ID }}
          FOUNTAIN_CLIENT_SECRET: ${{ secrets.FOUNTAIN_CLIENT_SECRET }}
        run: python3 scripts/sync_fountain_jobs.py --push
